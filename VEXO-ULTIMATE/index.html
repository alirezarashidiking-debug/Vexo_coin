<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090710"><title>VEXO — Secure Entry</title><link rel="stylesheet" href="css/style.css"><style>body{min-height:100vh;display:grid;place-items:center}.gate{width:min(560px,calc(100% - 32px));text-align:center;padding:38px 24px}.gate .coin{width:112px;height:112px;font-size:48px;margin:24px auto}.gate h1{font-size:clamp(34px,7vw,56px);margin:14px 0}.gate-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}.gate-status{margin-top:18px}</style></head>
<body><main class="card gate"><a class="brand" href="index.html">V<b>EXO</b></a><div class="coin">V</div><div class="eyebrow">THE NEXT PLAYER ECONOMY</div><h1>PLAY BEYOND.<br><span class="grad">RISE IN VEXO.</span></h1><p class="muted">Sign in or create your player account to enter the VEXO universe. All player services are available only after authentication.</p><div class="gate-actions"><a class="btn primary" href="login.html">Sign in / Create account</a></div><p id="gateStatus" class="notice gate-status" aria-live="polite">Checking your secure session…</p></main><script type="module">
import {auth} from './js/firebase.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js';
onAuthStateChanged(auth,user=>{if(user){location.replace('dashboard.html');}else{document.getElementById('gateStatus').textContent='Your VEXO account is protected by Firebase Authentication.';}});
</script></body></html>
