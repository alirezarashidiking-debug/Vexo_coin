<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEXO Login</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/login.css"></head><body><main class="auth-shell"><section class="auth-card"><a class="brand" href="index.html">V<b>EXO</b></a><div class="eyebrow">PLAYER ACCESS</div><h1>Welcome <span class="grad">back.</span></h1><p class="muted">Sign in or create your VEXO player account.</p><form id="loginForm"><label class="field">Account type<select id="mode"><option value="signin">Sign in</option><option value="signup">Create account</option></select></label><label class="field" id="usernameField">Username (for new accounts)<input id="username" maxlength="24" placeholder="Player name" autocomplete="nickname"></label><label class="field">Email<input id="email" type="email" required autocomplete="email"></label><label class="field">Password<input id="password" type="password" minlength="8" required autocomplete="current-password"></label><label class="field" id="confirmField">Confirm password (new accounts)<input id="confirm" type="password" minlength="8" autocomplete="new-password"></label><div class="auth-actions"><button class="btn primary" type="submit">Continue securely →</button><button class="btn" type="button" id="google">Continue with Google</button></div></form><p id="message" class="notice" aria-live="polite"></p><p class="muted">Firebase Authentication is used. Never share your password or wallet recovery phrase.</p></section></main><script>
const mode=document.getElementById('mode');
function syncMode(){const signup=mode.value==='signup';document.getElementById('usernameField').hidden=!signup;document.getElementById('confirmField').hidden=!signup;document.getElementById('password').autocomplete=signup?'new-password':'current-password';}
mode.addEventListener('change',syncMode);syncMode();
</script><script type="module" src="js/auth.js"></script></body></html>
